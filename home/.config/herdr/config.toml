onboarding = false
# Herdr config — https://herdr.dev/docs/configuration/

[terminal]
# Default shell is $SHELL on Linux.
default_shell = "/bin/bash"
# Must be usr\bin\bash.exe (the real bash), NOT bin\bash.exe (a launcher
# wrapper that herdr cannot drive directly).

[keys]
# Keep the ctrl+b prefix bindings, add direct prefix-free chords.
# NOT ctrl+alt: on the es-ES layout ctrl+alt IS AltGr, so the OS consumes those
# chords before herdr sees them. ctrl+shift is free and layout-independent.
# Brackets are also avoided: herdr only names minus/comma/ampersand/plus/backtick,
# and [ ] need AltGr on es-ES anyway.
focus_pane_left   = ["prefix+h", "ctrl+shift+h", "alt+h", "alt+left"]
focus_pane_down   = ["prefix+j", "ctrl+shift+j", "alt+j"]
focus_pane_up     = ["prefix+k", "ctrl+shift+k", "alt+k"]
focus_pane_right  = ["prefix+l", "ctrl+shift+l", "alt+l", "alt+right"]
previous_tab      = ["prefix+p", "ctrl+shift+left"]
next_tab          = ["prefix+n", "ctrl+shift+right"]
new_tab           = ["prefix+c", "ctrl+shift+t"]
split_vertical    = ["prefix+v", "ctrl+shift+d"]
split_horizontal  = ["prefix+minus", "ctrl+shift+minus"]
zoom              = ["prefix+z", "ctrl+shift+z"]
switch_tab        = "prefix+1..9"
switch_workspace  = "alt+1..9"
previous_workspace = ["prefix+ctrl+p", "ctrl+shift+up"]
next_workspace     = ["prefix+ctrl+n", "ctrl+shift+down"]
previous_agent   = ["prefix+up", "alt+up"]
next_agent       = ["prefix+down", "alt+down"]

[[keys.command]]
key = "alt+shift+h"
type = "shell"
command = "herdr pane swap --current --direction left"

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "herdr pane swap --current --direction down"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "herdr pane swap --current --direction up"

[[keys.command]]
key = "alt+shift+l"
type = "shell"
command = "herdr pane swap --current --direction right"

# Toggle the herdr-reviewr diff pane (plugin persiyanov.reviewr).
[[keys.command]]
key = "ctrl+shift+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

# Toggle the file explorer pane (plugin herdr-file-viewer), VS Code's explorer chord.
[[keys.command]]
key = "ctrl+shift+e"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[ui.sound]
enabled = false

[ui]
agent_panel_sort = "spaces"
# Show the focused pane's own title (shell + path from the prompt) in the Windows Terminal tab.
window_title = "{terminal_title}"
# Hide the per-pane scrollbars (mouse wheel still scrolls).
pane_scrollbars = false
# Rex-like: name each split pane by its agent, and show blocked/working/done by shape.
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.toast]
# Rex-like: floating in-app notifications when a background agent finishes or needs you.
delivery = "herdr"

